<style>
  :root{
    --bg:#0f1117; --card:#1a1d29; --accent:#ffb703; --accent2:#06d6a0;
    --danger:#ef476f; --text:#f1f1f6; --muted:#9aa0b4; --border:#2a2e40;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px;
  }
  .wrap{width:100%; max-width:640px;}
  h1{font-size:1.5rem; text-align:center; margin-bottom:4px;}
  .sub{text-align:center; color:var(--muted); margin-bottom:22px; font-size:.9rem;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .mode-btn{
    display:block; width:100%; padding:16px; margin-bottom:12px; border:none; border-radius:12px;
    background:linear-gradient(135deg,var(--accent2),#04a5f4); color:#04101a; font-weight:700; font-size:1.05rem;
    cursor:pointer; transition:transform .15s;
  }
  .mode-btn:hover{transform:scale(1.02);}
  .mode-btn.mix{background:linear-gradient(135deg,var(--accent),#ff6b35); color:#241300;}
  .day-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;}
  .day-chip{
    background:#232738; border:1px solid var(--border); color:var(--text); border-radius:10px;
    padding:14px 4px; text-align:center; cursor:pointer; font-weight:600; font-size:.95rem;
  }
  .day-chip:hover{border-color:var(--accent2);}
  .day-chip small{display:block; color:var(--muted); font-weight:400; font-size:.7rem; margin-top:3px;}
  .progress{height:6px; background:#232738; border-radius:4px; overflow:hidden; margin-bottom:18px;}
  .progress-bar{height:100%; background:var(--accent2); width:0%; transition:width .3s;}
  .qcount{color:var(--muted); font-size:.85rem; margin-bottom:6px;}
  .qtext-en{font-size:1.2rem; margin-bottom:8px; line-height:1.5; font-weight:600; color:var(--text);}
  .qtext-hi{color:var(--muted); font-size:.95rem; margin-bottom:18px; font-style:italic; line-height:1.4;}
  .opt{
    display:block; width:100%; text-align:left; background:#232738; border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:1rem;
  }
  .opt:hover{border-color:var(--accent2);}
  .opt.correct{background:rgba(6,214,160,.25); border-color:var(--accent2);}
  .opt.wrong{background:rgba(239,71,111,.25); border-color:var(--danger);}
  .opt[disabled]{cursor:default;}
  .explain{margin-top:12px; padding:12px; background:#151824; border-radius:10px; color:var(--muted); font-size:.9rem;}
  .nextbtn{margin-top:16px; width:100%; padding:14px; border:none; border-radius:10px; background:var(--accent2); color:#04101a; font-weight:700; font-size:1rem; cursor:pointer;}
  .score-big{font-size:2.6rem; text-align:center; margin:10px 0; font-weight:800; color:var(--accent);}
  .name-input{width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#232738; color:var(--text); font-size:1rem; margin-bottom:12px;}
  .lb-row{display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--border); font-size:.95rem;}
  .backlink{display:inline-block; margin-top:14px; color:var(--muted); text-decoration:none; font-size:.85rem;}
  .backlink:hover{color:var(--text);}
  .badge{display:inline-block; background:#232738; color:var(--muted); padding:2px 10px; border-radius:20px; font-size:.75rem; margin-bottom:10px;}
  .day-select{width:100%; padding:14px; border-radius:10px; border:1px solid var(--border); background:#232738; color:var(--text); font-size:1rem; margin-bottom:12px;}
  .footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:24px; padding-bottom:10px;}
  .footer b{color:var(--accent);}
  .phrase-popup{
    position:fixed; top:14%; left:50%; transform:translate(-50%,-20px) scale(0.85);
    padding:16px 28px; border-radius:16px; font-size:1.4rem; font-weight:800; color:#fff;
    opacity:0; z-index:999; text-align:center; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 8px 30px rgba(0,0,0,.4); white-space:nowrap;
  }
  .phrase-popup.show{opacity:1; transform:translate(-50%,0) scale(1);}
  .popup-correct{background:linear-gradient(135deg,#06d6a0,#04a5f4);}
  .popup-wrong{background:linear-gradient(135deg,#ef476f,#ff6b35);}
  .scorebar{display:flex; justify-content:space-between; background:#151824; border:1px solid var(--border); border-radius:10px; padding:8px 14px; margin-bottom:12px; font-size:.9rem; color:var(--muted);}
  .scorebar b{color:var(--accent); font-size:1.05rem;}
  .lifelines{display:flex; gap:8px; margin-top:6px;}
  .life{flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; cursor:pointer; font-size:.85rem;}
  .life[disabled]{opacity:.35; border-color:var(--border); color:var(--muted); cursor:default;}
  .opt.gone{opacity:.12; pointer-events:none; filter:blur(2px);}
  .timerbar{height:6px; background:#232738; border-radius:4px; overflow:hidden; margin-bottom:12px;}
  .timerfill{height:100%; width:100%; background:var(--accent2); transition:width .25s linear;}
  .timerfill.warn{background:#ef476f;}
  #timeTxt.warn{color:#ef476f;}
  .confetti{position:fixed;top:-30px;font-size:1.4rem;animation:fall 2.5s linear forwards;z-index:99;pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
  .sec-title{color:var(--muted);font-size:.85rem;margin:2px 0 10px;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-row .mode-btn{margin-bottom:0;font-size:.9rem;padding:12px 6px;background:#232738;color:var(--text);}
  .quest-banner{display:block; text-align:center; text-decoration:none; color:#fff; font-weight:700; font-size:.95rem; padding:14px 12px; margin-bottom:18px; border-radius:12px; background:linear-gradient(135deg,#e8571e,#f59e0b); box-shadow:0 4px 18px rgba(245,120,20,.35);}
  .quest-banner:active{transform:scale(.98);}
  .heard{background:#151824;border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;text-align:left;}
  .heard small{color:var(--muted);} #heardTxt{font-size:1.05rem;margin-top:4px;min-height:1.4em;}
  .wok{color:#06d6a0;font-weight:700;} .wno{color:#ef476f;font-weight:700;text-decoration:underline;}
  .errbox{background:rgba(239,71,111,.15);border:1px solid var(--danger);border-radius:10px;padding:10px;font-size:.9rem;text-align:left;}
  .recing{animation:pulse 1s infinite;} @keyframes pulse{50%{opacity:.55;}}
  .dcline{padding:3px 0;font-size:.95rem;}
</style>

    {hi:"खाली जगह भरें: \"You ___ tall.\"", en:'Fill in: "You ___ tall."', opts:["is","am","are","be"], correct:2, exp:'"You" के साथ हमेशा "are" आता है।'},
    {hi:"खाली जगह भरें: \"He ___ my friend.\"", en:'Fill in: "He ___ my friend."', opts:["am","are","is","be"], correct:2, exp:'"He/She/It" के साथ "is" आता है।'},
    {hi:"खाली जगह भरें: \"She ___ a nurse.\"", en:'Fill in: "She ___ a nurse."', opts:["are","am","be","is"], correct:3, exp:'"She" के साथ "is" आता है।'},
    {hi:"खाली जगह भरें: \"It ___ a dog.\"", en:'Fill in: "It ___ a dog."', opts:["is","are","am","be"], correct:0, exp:'"It" एक वचन (singular) है, इसलिए "is"।'},
    {hi:"खाली जगह भरें: \"We ___ friends.\"", en:'Fill in: "We ___ friends."', opts:["is","am","are","be"], correct:2, exp:'"We/You/They" के साथ "are" आता है।'},
    {hi:"खाली जगह भरें: \"They ___ students.\"", en:'Fill in: "They ___ students."', opts:["is","am","are","was"], correct:2, exp:'"They" के साथ "are" आता है।'},
    {hi:'"the dog" की जगह कौन-सा pronoun (सर्वनाम) आएगा?', en:'Which pronoun replaces "the dog"?', opts:["He","She","It","They"], correct:2, exp:'जानवर या वस्तु के लिए "It" का प्रयोग होता है।'},
    {hi:'"Ravi और Sita" (दो लोग) की जगह कौन-सा pronoun आएगा?', en:'Which pronoun replaces "Ravi and Sita" (two people)?', opts:["It","We","They","He"], correct:2, exp:'एक से अधिक लोगों के लिए "They" का प्रयोग होता है।'},
    {hi:'सही वाक्य चुनें:', en:"Choose the correct sentence:", opts:["He are happy","He is happy","He am happy","He be happy"], correct:1, exp:'"He" के साथ हमेशा "is" आता है।'},
  ]},
  18: { title: "Pronoun Practice & Describing Pictures", questions: [
    {hi:'"Pronoun" शब्द का अर्थ क्या है?', en:'What does "Pronoun" mean?', opts:["किसी काम को दिखाने वाला शब्द (क्रिया)","संज्ञा (noun) के स्थान पर प्रयोग होने वाला शब्द","किसी की विशेषता बताने वाला शब्द","किसी खास जगह का नाम"], correct:1, exp:'Pronoun वह शब्द है जो noun की जगह प्रयोग होता है — जैसे he, she, it, they।'},
    {hi:'एक लड़के के लिए सही वाक्य चुनें:', en:"Choose the correct sentence about a boy:", opts:["He are hungry.","He is hungry.","He am hungry.","He was hungry now."], correct:1, exp:'"He" + "is" सही रूप है।'},
    {hi:'खाली जगह भरें: \"They ___ playing football.\"', en:'Fill in: "They ___ playing football."', opts:["is","am","are","was"], correct:2, exp:'"They" के साथ "are" आता है।'},

    {hi:'Duolingo अभ्यास का मुख्य उद्देश्य क्या है?', en:"What is the main goal of Duolingo practice?", opts:["सिर्फ streak बनाए रखना","सार्थक भाषा अभ्यास और सीखना","तेज़ी से lesson खत्म करना","बिना सुने जवाब चुनना"], correct:1, exp:'लक्ष्य है meaningful language practice, न कि सिर्फ जल्दी खत्म करना।'},

  20: { title: "Speaking and Presentation Practice", questions: [

  128: {"title":"How Can I Become a Problem Solver","questions":[{"hi":"\"Approach\" शब्द का मतलब क्या है?","en":"What does \"Approach\" mean?","opts":["किसी काम को करने का एक तरीका","बात को पूरी तरह भूल जाना","सिर्फ किसी को धन्यवाद कह देना","सिर्फ किसी से माफी मांग लेना"],"correct":0,"exp":"Approach मतलब किसी काम को करने का एक तरीका।"},{"hi":"समस्या हल करने का सही क्रम कौन-सा है?","en":"What is the correct sequence for solving a problem?","opts":["PROBLEM → THINK → TRY → CHANGE YOUR APPROACH → SOLVE","SOLVE → PROBLEM → THINK","TRY → SOLVE → PROBLEM","THINK → SOLVE → TRY"],"correct":0,"exp":"सही क्रम है — PROBLEM → THINK → TRY → CHANGE YOUR APPROACH → SOLVE।"},{"hi":"एक अच्छे problem solver की पहचान क्या है?","en":"What identifies a good problem solver?","opts":["शांत रहना, समस्या को समझना, और समाधान सोचना","तुरंत हार मान लेना","समस्या को नज़रअंदाज़ करना","घबरा जाना"],"correct":0,"exp":"एक अच्छा problem solver शांत रहता है, समस्या को समझता है, और समाधान सोचता है।"},{"hi":"जब आपका पहला तरीका काम न करे, तो क्या करना चाहिए?","en":"When your first approach doesn't work, what should you do?","opts":["दूसरा approach आज़माना","पूरी तरह हार मान लेना","गुस्सा करना","किसी को दोष देना"],"correct":0,"exp":"अगर पहला तरीका काम न करे, तो एक अलग approach आज़माना चाहिए।"},{"hi":"\"First, I would…\" जैसे वाक्यों का प्रयोग किसलिए होता है?","en":"What are sentences like \"First, I would…\" used for?","opts":["अपने समाधान को क्रम में समझाने के लिए","सिर्फ किसी को धन्यवाद कहने के लिए","सिर्फ माफी मांगने के लिए","किसी को रोकने के लिए"],"correct":0,"exp":"ये वाक्य अपने समाधान को क्रम में समझाने के लिए प्रयोग होते हैं।"},{"hi":"\"I think this would work because…\" वाक्य किसलिए प्रयोग होता है?","en":"What is the sentence \"I think this would work because…\" used for?","opts":["अपने समाधान की वजह बताने के लिए","किसी को बधाई देने के लिए","सिर्फ समय बताने के लिए","किसी को रोकने के लिए"],"correct":0,"exp":"यह वाक्य अपने समाधान की वजह बताने के लिए प्रयोग होता है।"},{"hi":"\"My problem: ___\" टेम्   173: { title: "What If I Fail at What I Am Trying to Do?", questions: [

const app = document.getElementById('app');
let state = { mode:null, day:null, questions:[], idx:0, score:0, answered:false };

/* ============ AUDIO / SPEECH ENGINE (single reusable context) ============ */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}

let ttsVoices = [];
function loadVoices(){ try{ ttsVoices = speechSynthesis.getVoices() || []; }catch(e){} }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{ getAudioCtx(); }catch(e){}
  try{
    if('speechSynthesis' in window){
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0.01;
      speechSynthesis.speak(warm);
    }
  }catch(e){}
}
// Unlock on the very first tap anywhere in the app (required by mobile browsers)
document.addEventListener('click', unlockAudio, { once:true });
document.addEventListener('touchstart', unlockAudio, { once:true });
/* =========================================================================== */


function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 1;
    u.pitch = 1.1;
    u.volume = 1;
    if(!ttsVoices.length) loadVoices();
    const voice = ttsVoices.find(v => v.lang === (lang||'en-US')) || ttsVoices.find(v => v.lang && v.lang.startsWith('en'));
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

function showPhrasePopup(text, type){
  const popup = document.createElement('div');
  popup.className = 'phrase-popup ' + (type === 'correct' ? 'popup-correct' : 'popup-wrong');
  popup.textContent = text;
  document.body.appendChild(popup);
  requestAnimationFrame(()=> popup.classList.add('show'));
  setTimeout(()=>{
    popup.classList.remove('show');
    setTimeout(()=> popup.remove(), 300);
  }, 1500);
}

const PRAISE_PHRASES = [
  "Good job!", "Fantastic!", "Fabulous!", "Excellent!", "Marvelous!",
  "Brilliant!", "Outstanding!", "Spot on!", "Superb!", "Spectacular!",
  "You're on fire!", "Genius level!", "Absolutely perfect!"
];
const FAIL_PHRASES = [
  "Oh no, please try again!", "Try later.", "Better luck next time!",
  "So close! Try again!", "Don't give up yet!", "You'll get the next one!",
  "Nice try!", "Oops, not quite!"
];

let lastPraise = null, lastFail = null;
function pickPhrase(pool, lastPicked, setLast){
  let choice;
  if(pool.length <= 1) choice = pool[0];
  else { do { choice = pool[Math.floor(Math.random()*pool.length)]; } while(choice === lastPicked); }
  setLast(choice);
  return choice;
}

function playClap(ctx, delay){
  if(!ctx) return;
  try{
    const bufferSize = Math.floor(ctx.sampleRate * 0.18);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2.5);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1800; filter.Q.value = 0.8;
    const g = ctx.createGain(); g.gain.value = 0.9;
    noise.connect(filter); filter.connect(g); g.connect(ctx.destination);
    noise.start(ctx.currentTime + delay);
  }catch(e){}
}

function playCorrectSound(custom){
  const phrase = custom || pickPhrase(PRAISE_PHRASES, lastPraise, (v)=>lastPraise=v);
  try{
    const ctx = getAudioCtx();
    if(ctx){
      const notes = [523.25, 659.25, 783.99, 1046.5]; // C-E-G-C victory chime
      notes.forEach((f,i)=>{
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        const start = ctx.currentTime + i*0.09;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.22, start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start+0.16);
        o.start(start); o.stop(start+0.17);
      });
      playClap(ctx, 0.42); playClap(ctx, 0.56); playClap(ctx, 0.70);
    }
  }catch(e){}
  speak(phrase, 'en-US');
  showPhrasePopup(phrase, 'correct');
}

function playWrongSound(custom){
  const phrase = custom || pickPhrase(FAIL_PHRASES, lastFail, (v)=>lastFail=v);
  try{
    const ctx = getAudioCtx();
    if(ctx){
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(320, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(110, ctx.currentTime+0.45);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.16, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.45);
      o.start(); o.stop(ctx.currentTime+0.45);
    }
  }catch(e){}
  speak(phrase, 'en-US');
  showPhrasePopup(phrase, 'wrong');
}

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

// True Fisher-Yates shuffle for MCQ options — guarantees uniform random order every render
function fisherYatesShuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

           life:{fifty:true, hint:true, skip:true}, hidden:[] };

function startMix(){

function lifelineHtml(disabled){
  const L = state.life;
  const b = (key, label)=> `<button class="life" onclick="useLifeline('${key}')" ${(L[key] && !disabled) ? '' : 'disabled'}>${label}</button>`;

const QUESTION_TIME = 30; // seconds per question
let timerId = null, timerDeadline = 0, lastBeepSec = null;

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

function timerBeep(final){
  try{
    const ctx = getAudioCtx(); if(!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = final ? 400 : 900;
    const dur = final ? 0.45 : 0.12;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  }catch(e){}
}

function updateTimerUI(sec, msLeft){
  const t = document.getElementById('timeTxt');
  const f = document.getElementById('timerFill');
  if(t){ t.textContent = sec + 's'; t.classList.toggle('warn', sec <= 5); }
  if(f){ f.style.width = Math.max(0, Math.min(100, msLeft / (QUESTION_TIME*1000) * 100)) + '%'; f.classList.toggle('warn', sec <= 5); }
}

function startTimer(){
  stopTimer();
  timerDeadline = Date.now() + QUESTION_TIME * 1000;
  lastBeepSec = null;
  updateTimerUI(QUESTION_TIME, QUESTION_TIME * 1000);
  timerId = setInterval(tickTimer, 200);
}

function tickTimer(){
  if(state.answered){ stopTimer(); return; }
  const msLeft = timerDeadline - Date.now();
  const sec = Math.max(0, Math.ceil(msLeft / 1000));
  updateTimerUI(sec, msLeft);
  // last 5 seconds: one beep per second (5,4,3,2,1)
  if(sec >= 1 && sec <= 5 && sec !== lastBeepSec){ lastBeepSec = sec; timerBeep(false); }
  if(msLeft <= 0){
    stopTimer();
    timerBeep(true);
    showPhrasePopup("Time's up! ⏰", 'wrong');
    skipQuestion(true);
  }
}

function skipQuestion(auto){
  stopTimer();
  state.skipped++;
  state.wrong.push(state.questions[state.idx]); // revision me dobara aayega
  if(!auto){
    state.life.skip = false;
    showPhrasePopup('Skipped!', 'correct');
  }
  state.idx++;
  state.answered = false;
  if(state.idx >= state.questions.length){ renderResult(); return; }
  renderQuestion();
}

function renderQuestion(){
  const q = state.questions[state.idx];
  // Fisher-Yates shuffle option order on every render — correct answer position is never predictable
  const displayIndices = fisherYatesShuffle(q.opts.map((_,i)=>i));
  state.currentDisplayIndices = displayIndices; // displayIndices[displayPos] = originalOptIndex
  state.currentCorrectDisplayPos = displayIndices.indexOf(q.correct);
  state.hidden = [];
  const pct = Math.round((state.idx/state.questions.length)*100);
  let optsHtml = '';
  displayIndices.forEach((origIdx, displayPos)=>{
    optsHtml += `<button class="opt" onclick="selectOpt(${displayPos})" id="opt${displayPos}">${q.opts[origIdx]}</button>`;
  });
  const badge = state.mode==='mix' ? 'Mix Mode'
              : state.mode==='revision' ? '🔁 Revision — गलत / Skip किए सवाल'
              : 'Day '+state.day+' — '+QUIZ_DATA[state.day].title;
  app.innerHTML = `
    <div class="badge">${badge}</div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="scorebar"><span>🏏 Score: <b id="runsTxt">${state.runs}/${state.wickets}</b></span><span>⏱️ <b id="timeTxt">${QUESTION_TIME}s</b></span><span>🔥 Streak: <b id="streakTxt">${state.streak}</b></span></div>
    <div class="timerbar"><div class="timerfill" id="timerFill"></div></div>
    <div class="card">
      <div class="qcount">Question ${state.idx+1} / ${state.questions.length}</div>
      <div class="qtext-en">${q.en}</div>
      <div class="qtext-hi">${q.hi}</div>
      <div id="optsWrap">${optsHtml}</div>
      <div class="lifelines" id="lifeWrap">${lifelineHtml(false)}</div>
      <div id="explainWrap"></div>
    </div>`;
  startTimer();
}

function hideWrongOptions(n){
  const total = state.currentDisplayIndices.length;
  let wrongs = [];
  for(let i=0;i<total;i++){
    if(i !== state.currentCorrectDisplayPos && !state.hidden.includes(i)) wrongs.push(i);
  }
  wrongs = shuffle(wrongs).slice(0, n);
  wrongs.forEach(p=>{
    state.hidden.push(p);
    const b = document.getElementById('opt'+p);
    if(b){ b.disabled = true; b.classList.add('gone'); }
  });
}
function wrongOptionsLeft(){
  return state.currentDisplayIndices.length - 1 - state.hidden.length;
}

function useLifeline(type){
  if(state.answered || !state.life[type]) return;
  unlockAudio();
  if(type === 'fifty'){
    const n = Math.min(2, wrongOptionsLeft() - 1);
    if(n < 1) return;
    hideWrongOptions(n);
  } else if(type === 'hint'){
    if(wrongOptionsLeft() < 2) return;
    hideWrongOptions(1);
  } else if(type === 'skip'){
    skipQuestion(false);
    return;
  }
  state.life[type] = false;
  document.getElementById('lifeWrap').innerHTML = lifelineHtml(false);
}

function selectOpt(displayPos){
  if(state.answered || state.hidden.includes(displayPos)) return;
  unlockAudio();
  state.answered = true;
  stopTimer();
  const q = state.questions[state.idx];
  const correctDisplayPos = state.currentCorrectDisplayPos;
  const correct = displayPos === correctDisplayPos;
  if(correct){
    state.score++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const six = state.streak >= 3;
    state.runs += six ? 6 : 4;
    playCorrectSound(six ? 'SIX! ' + state.streak + ' in a row!' : 'FOUR!');
  } else {
    state.wickets++;
    state.streak = 0;
    state.wrong.push(q);
    playWrongSound('OUT! Wicket down');
  }
  document.getElementById('runsTxt').textContent = state.runs + '/' + state.wickets;
  document.getElementById('streakTxt').textContent = state.streak;
  document.getElementById('lifeWrap').innerHTML = lifelineHtml(true);
  const optButtons = document.querySelectorAll('#optsWrap .opt');
  optButtons.forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx === correctDisplayPos){
      btn.classList.add('correct');
      btn.innerHTML = '✅&nbsp; ' + btn.innerHTML;
    } else if(idx === displayPos){
      btn.classList.add('wrong');
      btn.innerHTML = '❌&nbsp; ' + btn.innerHTML;
    }
  });
  document.getElementById('explainWrap').innerHTML = `
    <div class="explain">${correct ? '✅ सही जवाब!' : '❌ गलत।'} ${q.exp}</div>
    <button class="nextbtn" onclick="nextQuestion()">${state.idx+1 < state.questions.length ? 'अगला सवाल →' : 'परिणाम देखें →'}</button>`;
}

function nextQuestion(){
  state.idx++;
  state.answered = false;
  if(state.idx >= state.questions.length){ renderResult(); return; }
  renderQuestion();
}

function renderResult(){
  stopTimer();
  recordResult();
  const total = state.questions.length;
  const pct = Math.round((state.score/total)*100);
  const verdict = pct >= 80 ? '🏆 Man of the Match!' : pct >= 50 ? '👍 अच्छा खेले!' : '💪 Practice करो, अगला match आप जीतोगे!';

      <div style="font-size:1.1rem;color:var(--muted);">आपका स्कोर</div>
      <div class="score-big">${state.score} / ${total}</div>
      <div style="color:var(--accent2);margin-bottom:6px;">${pct}%</div>
      <div style="margin-bottom:6px;">🏏 <b>${state.runs}/${state.wickets}</b> &nbsp;·&nbsp; 🔥 Best Streak: <b>${state.bestStreak}</b> &nbsp;·&nbsp; ⏭️ Skipped: <b>${state.skipped}</b></div>
      <div style="font-size:1.1rem;margin:10px 0 16px;">${verdict}</div>

    </div>`;

function getProf(){ let p=null; try{ p=JSON.parse(localStorage.getItem('fea_trb_profile')); }catch(e){} return p||{xp:0,best:{},spoken:0,bestStreak:0}; }
function saveProf(p){ try{ localStorage.setItem('fea_trb_profile', JSON.stringify(p)); }catch(e){} }
const LEVELS=[['🌱 Beginner',0],['📘 Learner',50],['🎓 Scholar',150],['🏆 Topper',300]];
function levelOf(xp){ let l=LEVELS[0], n=LEVELS[1]; LEVELS.forEach((x,i)=>{ if(xp>=x[1]){ l=x; n=LEVELS[i+1]||null; } }); return {name:l[0], next:n}; }
function confetti(){ for(let i=0;i<40;i++){ const e=document.createElement('div'); e.className='confetti'; e.textContent=['🎉','✨','🏏','⭐'][i%4]; e.style.left=(Math.random()*100)+'vw'; e.style.animationDelay=(Math.random()*0.8)+'s'; document.body.appendChild(e); setTimeout(()=>e.remove(),3500); } }
function recordResult(){
  const p=getProf(), total=state.questions.length, pct=Math.round(state.score/total*100);
  p.xp+=state.score; p.bestStreak=Math.max(p.bestStreak||0,state.bestStreak);
  if(state.mode==='day' && pct>(p.best[state.day]||0)) p.best[state.day]=pct;
  saveProf(p); if(pct>=80) confetti();
}

function listenOnce(onLive,onDone){
  stopRec(); try{ speechSynthesis.cancel(); }catch(e){}
  let heard='', alts=[], err=null, tm=null;
  const r=newRec(false); curRec=r;
  r.onresult=e=>{
    heard=''; alts=[];
    for(let i=0;i<e.results.length;i++){ heard+=e.results[i][0].transcript+' '; for(let a=0;a<e.results[i].length;a++) alts.push(e.results[i][a].transcript); }
    heard=heard.trim(); onLive(heard);
  };
  r.onerror=ev=>{ err=ev.error; };
  r.onend=()=>{ clearTimeout(tm); if(curRec===r) curRec=null; onDone({heard:heard, alts:alts, err:err}); };
  tm=setTimeout(()=>{ try{ r.stop(); }catch(e){} },12000);
  try{ r.start(); }catch(e){ clearTimeout(tm); onDone({heard:'',alts:[],err:'start-failed'}); }
}

function quizSentences(){ const out=[]; Object.values(QUIZ_DATA).forEach(d=>d.questions.forEach(q=>{ const s=q.opts[q.correct].replace(/^["“]|["”]$/g,'').trim(); const w=s.split(/\s+/).length; if(/^[A-Z][^?]*[.!]$/.test(s)&&w>=4&&w<=12) out.push(s); })); return out; }
function startSpeak(kind){
  stopRec();
  const pool=kind==='twister'?TWISTERS:kind==='filmy'?FILMY:quizSentences();
  sp={kind:kind, list:shuffle(pool).slice(0,8), i:0, runs:0, got:{}, tries:0};
  renderSpeak();
}
function renderSpeak(){
  stopRec();
  if(sp.i>=sp.list.length){
    if(sp.runs>=8) confetti();
    app.innerHTML=`<div class="card" style="text-align:center;"><div style="font-size:1.1rem;color:var(--muted);">${SP_TITLE[sp.kind]}</div><div class="score-big">🏏 +${sp.runs} runs</div><div style="margin:10px 0 16px;">शाबाश! रोज़ थोड़ा-थोड़ा बोलो, fluency अपने-आप आएगी। 💪</div><button class="mode-btn" onclick="startSpeak('${sp.kind}')">🔁 दोबारा खेलें</button><button class="mode-btn mix" onclick="renderHome()">🏠 Home</button></div>`;
    return;
  }
  sp.tries=0;
  app.innerHTML=`<div class="badge">${SP_TITLE[sp.kind]}</div><div class="card" style="text-align:center;">
    <div class="qcount">${sp.i+1} / ${sp.list.length} · 🏏 Bonus runs: <b id="spRuns">${sp.runs}</b></div>
    <div class="qtext-en" id="spTarget" style="font-size:1.3rem;margin:14px 0;">${sp.list[sp.i]}</div>
    <div class="btn-row" style="margin-bottom:10px;"><button class="mode-btn" onclick="listenCur()">🔊 सुनो</button><button class="mode-btn" id="micBtn" style="background:var(--accent);color:#1a1200;" onclick="recordCur()">🎤 बोलो</button></div>
    <div id="spRes" style="min-height:48px;margin-bottom:10px;"></div>
    <button class="nextbtn" onclick="spNext()">⏭️ अगला</button>
    <a class="backlink" onclick="renderHome()" href="javascript:void(0)">← Home</a></div>`;
  if(sp.kind==='shadow') setTimeout(listenCur,300);
}
function listenCur(){ unlockAudio(); stopRec(); speak(sp.list[sp.i],'en-US'); }
function spNext(){ sp.i++; renderSpeak(); }

function normW(s){ return s.toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean); }
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>1) return 2; const d=[]; for(let i=0;i<=m;i++) d[i]=[i]; for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
// word-by-word comparison (small spelling differences allowed)
function diffWords(target,heard){
  const hw=normW(heard), used=hw.map(()=>false), marks=[]; let ok=0;
  target.split(/\s+/).forEach(tok=>{
    const w=normW(tok).join(''); let hit=false;
    if(w){ for(let i=0;i<hw.length;i++){ if(!used[i]&&(hw[i]===w||(w.length>=4&&lev(hw[i],w)<=1))){ used[i]=true; hit=true; break; } } }
    if(hit) ok++; marks.push({w:tok,ok:hit||!w});
  });
  return {pct:Math.round(ok/Math.max(1,marks.length)*100), marks:marks};
}
function heardBox(t){ return `<div class="heard"><small>🎧 गेम ने सुना:</small><div id="heardTxt">${t}</div></div>`; }

function recordCur(){
  unlockAudio();
  const res=document.getElementById('spRes'), btn=document.getElementById('micBtn');
  if(!SR_API){ res.innerHTML='<div class="errbox">'+NO_SR+'</div>'; return; }
  const target=sp.list[sp.i];
  btn.classList.add('recing'); btn.textContent='🔴 सुन रहा हूँ...';
  res.innerHTML=heardBox('<span style="color:var(--muted)">…अब बोलिए!</span>');
  listenOnce(t=>{ const h=document.getElementById('heardTxt'); if(h) h.textContent=t; }, r=>{
    btn.classList.remove('recing'); btn.textContent='🎤 बोलो';
    if(!r.heard){ res.innerHTML='<div class="errbox">'+(ERR_MSG[r.err]||ERR_MSG['no-speech'])+'</div>'; return; }
    let best=null; [r.heard].concat(r.alts).forEach(h=>{ const d=diffWords(target,h); if(!best||d.pct>best.pct){ best=d; best.h=h; } });
    const words=best.marks.map(m=>`<span class="${m.ok?'wok':'wno'}">${esc(m.w)}</span>`).join(' ');
    sp.tries++;
    if(best.pct>=60){
      let note='';
      if(!sp.got[sp.i]){ sp.got[sp.i]=1; sp.runs+=2; const p=getProf(); p.spoken=(p.spoken||0)+1; p.xp+=2; saveProf(p); const e=document.getElementById('spRuns'); if(e) e.textContent=sp.runs; playCorrectSound('SIX! Well spoken!'); note=' · +2 runs'; }
      else note=' · (runs पहले मिल चुके)';
      res.innerHTML=heardBox(esc(best.h))+`<div style="margin:8px 0;">✅ <b>${best.pct}% match</b>${note}</div><div>${words}</div>`;
    } else {
      playWrongSound('Try again!');
      res.innerHTML=heardBox(esc(best.h))+`<div style="margin:8px 0;">❌ <b>${best.pct}% match</b> — <span class="wno">लाल</span> शब्द फिर से बोलें</div><div>${words}</div>`+(sp.tries>=2?'<div style="color:var(--muted);font-size:.85rem;margin-top:8px;">💡 पहले 🔊 सुनें, फिर mic के पास धीरे-धीरे साफ़ बोलें। ज़रूरत हो तो ⏭️ अगला दबाएँ।</div>':'');
    }
  });
}

    <div style="margin-bottom:6px;">${SR_API?'✅ इस browser में voice सपोर्ट है':'❌ voice सपोर्ट नहीं'}</div>

    <div id="spRes" style="min-height:48px;margin:10px 0;"></div>

function runMicTest(){
  unlockAudio();
  const res=document.getElementById('spRes'), btn=document.getElementById('micBtn');
  if(!SR_API){ res.innerHTML='<div class="errbox">'+NO_SR+'</div>'; return; }
  btn.classList.add('recing'); btn.textContent='🔴 सुन रहा हूँ...';
  res.innerHTML=heardBox('<span style="color:var(--muted)">…अब बोलिए!</span>');
  listenOnce(t=>{ const h=document.getElementById('heardTxt'); if(h) h.textContent=t; }, r=>{
    btn.classList.remove('recing'); btn.textContent='🎤 फिर से बोलो';
    res.innerHTML=r.heard?heardBox(esc(r.heard))+'<div style="margin-top:8px;">✅ Mic बिल्कुल सही चल रहा है!</div>':'<div class="errbox">'+(ERR_MSG[r.err]||ERR_MSG['no-speech'])+'</div>';
  });
}

/* ===== DAILY 1-MINUTE CHALLENGE ===== */
const TOPICS=["My favourite cricketer","My family","My best friend","My dream job","My favourite movie","A festival I love","My daily routine"];
const STARTERS=["My topic is ___.","I like it because ___.","For example, ___.","Another thing is ___.","In the end, ___."];
let dcTimer=null, dcRec=null, dc=null;
const wc=s=>{ const t=s.trim(); return t?t.split(/\s+/).length:0; };
function stopDaily(){ if(dcTimer){ clearInterval(dcTimer); dcTimer=null; } if(dcRec){ try{ dcRec.onend=null; dcRec.onresult=null; dcRec.onerror=null; dcRec.abort(); }catch(e){} dcRec=null; } }
function renderDaily(){
  stopDaily(); stopRec(); dc=null;
  const topic=TOPICS[Math.floor(Date.now()/86400000)%TOPICS.length];
  app.innerHTML=`<div class="badge">🗣️ Daily 1-Minute Challenge</div><div class="card" style="text-align:center;">
    <div style="color:var(--muted);">आज का Topic</div><div class="qtext-en" style="font-size:1.4rem;margin:8px 0;">${topic}</div>
    <div style="text-align:left;background:#151824;border-radius:10px;padding:10px;font-size:.88rem;color:var(--muted);margin-bottom:10px;">💡 इन वाक्यों से शुरू करें:<br>${STARTERS.map(s=>'• '+s).join('<br>')}</div>
    <div class="score-big" id="dcTime">60</div>
    <div style="color:var(--muted);font-size:.9rem;">शब्द बोले: <b id="dcWords" style="color:var(--accent)">0</b></div>
    <div class="heard" style="margin-top:10px;"><small>📝 आपने जो बोला (गेम ने जो सुना):</small><div id="dcLive" style="margin-top:4px;"><span style="color:var(--muted)">Start दबाने के बाद आपके वाक्य यहाँ दिखेंगे…</span></div></div>
    <div id="dcRes" style="min-height:24px;margin:10px 0;"></div>
    <button class="mode-btn" id="dcBtn" onclick="startDaily()">🎤 Start</button>
    <a class="backlink" onclick="stopDaily();renderHome()" href="javascript:void(0)">← Home</a></div>`;
}
function dcRender(){
  const box=document.getElementById('dcLive'); if(!box||!dc) return;
  const lines=dc.final.map((t,i)=>`<div class="dcline">${i+1}. ${esc(t)}</div>`).join('');
  const it=dc.interim?`<div class="dcline" style="opacity:.6;font-style:italic;">${esc(dc.interim)}…</div>`:'';
  box.innerHTML=(lines+it)||'<span style="color:var(--muted)">🎙️ बोलिए… (अभी कुछ सुनाई नहीं दिया)</span>';
  const w=document.getElementById('dcWords'); if(w) w.textContent=wc(dc.final.join(' ')+' '+dc.interim);
}
function addFinal(t){
  t=(t||'').trim(); if(!t) return;
  const last=dc.final[dc.final.length-1];
  if(last && t.toLowerCase().startsWith(last.toLowerCase())) dc.final[dc.final.length-1]=t;   // Android repeats growing text
  else if(!last || last.toLowerCase()!==t.toLowerCase()) dc.final.push(t);
}
function startDcRec(){
  const r=newRec(true); dcRec=r;
  r.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) addFinal(t); else interim+=t+' ';
    }
    dc.interim=interim.trim(); dcRender();
  };
  r.onerror=ev=>{
    if(['not-allowed','service-not-allowed','audio-capture'].indexOf(ev.error)>=0){ dc.fatal=true; const x=document.getElementById('dcRes'); if(x) x.innerHTML='<div class="errbox">'+ERR_MSG[ev.error]+'</div>'; }
    else if(ev.error==='network'){ const x=document.getElementById('dcRes'); if(x) x.innerHTML='<div class="errbox">'+ERR_MSG.network+'</div>'; }
  };
  r.onend=()=>{ if(dc&&!dc.fatal&&dc.left>0&&dcRec===r) setTimeout(()=>{ if(dc&&!dc.fatal&&dc.left>0&&dcRec===r) startDcRec(); },200); };
  try{ r.start(); }catch(e){}
}
function startDaily(){
  stopDaily(); stopRec(); unlockAudio(); try{ speechSynthesis.cancel(); }catch(e){}
  dc={left:60, final:[], interim:'', fatal:false};
  const res=document.getElementById('dcRes'), tm=document.getElementById('dcTime'), btn=document.getElementById('dcBtn');
  btn.disabled=true; btn.textContent='🔴 रिकॉर्डिंग चालू...';
  if(SR_API){ res.textContent=''; dcRender(); startDcRec(); }
  else { res.innerHTML='<div class="errbox">'+NO_SR+'</div><div style="color:var(--muted);font-size:.85rem;margin-top:6px;">⏱️ Timer चलेगा — बोलने का अभ्यास करें।</div>'; }
  dcTimer=setInterval(()=>{
    dc.left--; tm.textContent=dc.left;
    if(dc.left<=0){
      stopDaily(); if(dc.interim) addFinal(dc.interim); dc.interim=''; dcRender();
      const words=wc(dc.final.join(' ')), lines=dc.final.length;
      const p=getProf(); const gain=Math.min(10,Math.floor(words/10)); p.xp+=gain; saveProf(p);
      if(words>=40) confetti();
      btn.disabled=false; btn.textContent='🔁 फिर से करो'; btn.onclick=renderDaily;
      res.innerHTML=SR_API?(words?`<div style="font-size:1.05rem;">⏰ Time up!<br>आपने लगभग <b>${words} words</b> · <b>${lines}</b> वाक्य/हिस्से बोले · +${gain} XP</div><div style="color:var(--muted);font-size:.9rem;margin-top:4px;">${words>=60?'🔥 Excellent fluency!':words>=40?'👍 बहुत अच्छा!':'💪 अगली बार और बोलो — 40+ words का लक्ष्य रखें!'}</div>`:`<div class="errbox">⏰ Time up! कुछ भी सुनाई नहीं दिया।<br>${ERR_MSG['no-speech']}<br><small>पहले 🎙️ Mic Test से जाँचें।</small></div>`):'⏰ Time up! शाबाश — अब अपने दोस्त को सुनाओ। 👏';
    }
  },1000);
}

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
renderHome();
</script>
