<style>
  :root{
    --bg:#0f1117; --card:#1a1d29; --accent:#ffb703; --accent2:#06d6a0;
    --danger:#ef476f; --text:#f1f1f6; --muted:#9aa0b4; --border:#2a2e40;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px;
  }
  .wrap{width:100%; max-width:640px;}
  h1{font-size:1.5rem; text-align:center; margin-bottom:4px;}
  .sub{text-align:center; color:var(--muted); margin-bottom:22px; font-size:.9rem;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .mode-btn{
    display:block; width:100%; padding:16px; margin-bottom:12px; border:none; border-radius:12px;
    background:linear-gradient(135deg,var(--accent2),#04a5f4); color:#04101a; font-weight:700; font-size:1.05rem;
    cursor:pointer; transition:transform .15s;
  }
  .mode-btn:hover{transform:scale(1.02);}
  .mode-btn.mix{background:linear-gradient(135deg,var(--accent),#ff6b35); color:#241300;}
  .day-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;}
  .day-chip{
    background:#232738; border:1px solid var(--border); color:var(--text); border-radius:10px;
    padding:14px 4px; text-align:center; cursor:pointer; font-weight:600; font-size:.95rem;
  }
  .day-chip:hover{border-color:var(--accent2);}
  .day-chip small{display:block; color:var(--muted); font-weight:400; font-size:.7rem; margin-top:3px;}
  .progress{height:6px; background:#232738; border-radius:4px; overflow:hidden; margin-bottom:18px;}
  .progress-bar{height:100%; background:var(--accent2); width:0%; transition:width .3s;}
  .qcount{color:var(--muted); font-size:.85rem; margin-bottom:6px;}
  .qtext-en{font-size:1.2rem; margin-bottom:8px; line-height:1.5; font-weight:600; color:var(--text);}
  .qtext-hi{color:var(--muted); font-size:.95rem; margin-bottom:18px; font-style:italic; line-height:1.4;}
  .opt{
    display:block; width:100%; text-align:left; background:#232738; border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:1rem;
  }
  .opt:hover{border-color:var(--accent2);}
  .opt.correct{background:rgba(6,214,160,.25); border-color:var(--accent2);}
  .opt.wrong{background:rgba(239,71,111,.25); border-color:var(--danger);}
  .opt[disabled]{cursor:default;}
  .explain{margin-top:12px; padding:12px; background:#151824; border-radius:10px; color:var(--muted); font-size:.9rem;}
  .nextbtn{margin-top:16px; width:100%; padding:14px; border:none; border-radius:10px; background:var(--accent2); color:#04101a; font-weight:700; font-size:1rem; cursor:pointer;}
  .score-big{font-size:2.6rem; text-align:center; margin:10px 0; font-weight:800; color:var(--accent);}
  .name-input{width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#232738; color:var(--text); font-size:1rem; margin-bottom:12px;}
  .lb-row{display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--border); font-size:.95rem;}
  .backlink{display:inline-block; margin-top:14px; color:var(--muted); text-decoration:none; font-size:.85rem;}
  .backlink:hover{color:var(--text);}
  .badge{display:inline-block; background:#232738; color:var(--muted); padding:2px 10px; border-radius:20px; font-size:.75rem; margin-bottom:10px;}
  .day-select{width:100%; padding:14px; border-radius:10px; border:1px solid var(--border); background:#232738; color:var(--text); font-size:1rem; margin-bottom:12px;}
  .footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:24px; padding-bottom:10px;}
  .footer b{color:var(--accent);}
  .phrase-popup{
    position:fixed; top:14%; left:50%; transform:translate(-50%,-20px) scale(0.85);
    padding:16px 28px; border-radius:16px; font-size:1.4rem; font-weight:800; color:#fff;
    opacity:0; z-index:999; text-align:center; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 8px 30px rgba(0,0,0,.4); white-space:nowrap;
  }
  .phrase-popup.show{opacity:1; transform:translate(-50%,0) scale(1);}
  .popup-correct{background:linear-gradient(135deg,#06d6a0,#04a5f4);}
  .popup-wrong{background:linear-gradient(135deg,#ef476f,#ff6b35);}
  .scorebar{display:flex; justify-content:space-between; background:#151824; border:1px solid var(--border); border-radius:10px; padding:8px 14px; margin-bottom:12px; font-size:.9rem; color:var(--muted);}
  .scorebar b{color:var(--accent); font-size:1.05rem;}
  .lifelines{display:flex; gap:8px; margin-top:6px;}
  .life{flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; cursor:pointer; font-size:.85rem;}
  .life[disabled]{opacity:.35; border-color:var(--border); color:var(--muted); cursor:default;}
  .opt.gone{opacity:.12; pointer-events:none; filter:blur(2px);}
  .timerbar{height:6px; background:#232738; border-radius:4px; overflow:hidden; margin-bottom:12px;}
  .timerfill{height:100%; width:100%; background:var(--accent2); transition:width .25s linear;}
  .timerfill.warn{background:#ef476f;}
  #timeTxt.warn{color:#ef476f;}
  .confetti{position:fixed;top:-30px;font-size:1.4rem;animation:fall 2.5s linear forwards;z-index:99;pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
  .sec-title{color:var(--muted);font-size:.85rem;margin:2px 0 10px;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-row .mode-btn{margin-bottom:0;font-size:.9rem;padding:12px 6px;background:#232738;color:var(--text);}
  .quest-banner{display:block; text-align:center; text-decoration:none; color:#fff; font-weight:700; font-size:.95rem; padding:14px 12px; margin-bottom:18px; border-radius:12px; background:linear-gradient(135deg,#e8571e,#f59e0b); box-shadow:0 4px 18px rgba(245,120,20,.35);}
  .quest-banner:active{transform:scale(.98);}
  .heard{background:#151824;border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;text-align:left;}
  .heard small{color:var(--muted);} #heardTxt{font-size:1.05rem;margin-top:4px;min-height:1.4em;}
  .wok{color:#06d6a0;font-weight:700;} .wno{color:#ef476f;font-weight:700;text-decoration:underline;}
  .errbox{background:rgba(239,71,111,.15);border:1px solid var(--danger);border-radius:10px;padding:10px;font-size:.9rem;text-align:left;}
  .recing{animation:pulse 1s infinite;} @keyframes pulse{50%{opacity:.55;}}
  .dcline{padding:3px 0;font-size:.95rem;}
</style>

    {hi:"खाली जगह भरें: \"You ___ tall.\"", en:'Fill in: "You ___ tall."', opts:["is","am","are","be"], correct:2, exp:'"You" के साथ हमेशा "are" आता है।'},
    {hi:"खाली जगह भरें: \"He ___ my friend.\"", en:'Fill in: "He ___ my friend."', opts:["am","are","is","be"], correct:2, exp:'"He/She/It" के साथ "is" आता है।'},
    {hi:"खाली जगह भरें: \"She ___ a nurse.\"", en:'Fill in: "She ___ a nurse."', opts:["are","am","be","is"], correct:3, exp:'"She" के साथ "is" आता है।'},
    {hi:"खाली जगह भरें: \"It ___ a dog.\"", en:'Fill in: "It ___ a dog."', opts:["is","are","am","be"], correct:0, exp:'"It" एक वचन (singular) है, इसलिए "is"।'},
    {hi:"खाली जगह भरें: \"We ___ friends.\"", en:'Fill in: "We ___ friends."', opts:["is","am","are","be"], correct:2, exp:'"We/You/They" के साथ "are" आता है।'},
    {hi:"खाली जगह भरें: \"They ___ students.\"", en:'Fill in: "They ___ students."', opts:["is","am","are","was"], correct:2, exp:'"They" के साथ "are" आता है।'},
    {hi:'"the dog" की जगह कौन-सा pronoun (सर्वनाम) आएगा?', en:'Which pronoun replaces "the dog"?', opts:["He","She","It","They"], correct:2, exp:'जानवर या वस्तु के लिए "It" का प्रयोग होता है।'},
    {hi:'"Ravi और Sita" (दो लोग) की जगह कौन-सा pronoun आएगा?', en:'Which pronoun replaces "Ravi and Sita" (two people)?', opts:["It","We","They","He"], correct:2, exp:'एक से अधिक लोगों के लिए "They" का प्रयोग होता है।'},
    {hi:'सही वाक्य चुनें:', en:"Choose the correct sentence:", opts:["He are happy","He is happy","He am happy","He be happy"], correct:1, exp:'"He" के साथ हमेशा "is" आता है।'},
  ]},
  18: { title: "Pronoun Practice & Describing Pictures", questions: [
    {hi:'"Pronoun" शब्द का अर्थ क्या है?', en:'What does "Pronoun" mean?', opts:["किसी काम को दिखाने वाला शब्द (क्रिया)","संज्ञा (noun) के स्थान पर प्रयोग होने वाला शब्द","किसी की विशेषता बताने वाला शब्द","किसी खास जगह का नाम"], correct:1, exp:'Pronoun वह शब्द है जो noun की जगह प्रयोग होता है — जैसे he, she, it, they।'},
    {hi:'एक लड़के के लिए सही वाक्य चुनें:', en:"Choose the correct sentence about a boy:", opts:["He are hungry.","He is hungry.","He am hungry.","He was hungry now."], correct:1, exp:'"He" + "is" सही रूप है।'},
    {hi:'खाली जगह भरें: \"They ___ playing football.\"', en:'Fill in: "They ___ playing football."', opts:["is","am","are","was"], correct:2, exp:'"They" के साथ "are" आता है।'},

    {hi:'Duolingo अभ्यास का मुख्य उद्देश्य क्या है?', en:"What is the main goal of Duolingo practice?", opts:["सिर्फ streak बनाए रखना","सार्थक भाषा अभ्यास और सीखना","तेज़ी से lesson खत्म करना","बिना सुने जवाब चुनना"], correct:1, exp:'लक्ष्य है meaningful language practice, न कि सिर्फ जल्दी खत्म करना।'},

  20: { title: "Speaking and Presentation Practice", questions: [
