<style>
  :root{
    --bg:#0f1117; --card:#1a1d29; --accent:#ffb703; --accent2:#06d6a0;
    --danger:#ef476f; --text:#f1f1f6; --muted:#9aa0b4; --border:#2a2e40;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px;
  }
  .wrap{width:100%; max-width:640px;}
  h1{font-size:1.5rem; text-align:center; margin-bottom:4px;}
  .sub{text-align:center; color:var(--muted); margin-bottom:22px; font-size:.9rem;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .mode-btn{
    display:block; width:100%; padding:16px; margin-bottom:12px; border:none; border-radius:12px;
    background:linear-gradient(135deg,var(--accent2),#04a5f4); color:#04101a; font-weight:700; font-size:1.05rem;
    cursor:pointer; transition:transform .15s;
  }
  .mode-btn:hover{transform:scale(1.02);}
  .mode-btn.mix{background:linear-gradient(135deg,var(--accent),#ff6b35); color:#241300;}
  .day-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;}
  .day-chip{
    background:#232738; border:1px solid var(--border); color:var(--text); border-radius:10px;
    padding:14px 4px; text-align:center; cursor:pointer; font-weight:600; font-size:.95rem;
  }
  .day-chip:hover{border-color:var(--accent2);}
  .day-chip small{display:block; color:var(--muted); font-weight:400; font-size:.7rem; margin-top:3px;}
  .progress{height:6px; background:#232738; border-radius:4px; overflow:hidden; margin-bottom:18px;}
  .progress-bar{height:100%; background:var(--accent2); width:0%; transition:width .3s;}
  .qcount{color:var(--muted); font-size:.85rem; margin-bottom:6px;}
  .qtext-en{font-size:1.2rem; margin-bottom:8px; line-height:1.5; font-weight:600; color:var(--text);}
  .qtext-hi{color:var(--muted); font-size:.95rem; margin-bottom:18px; font-style:italic; line-height:1.4;}
  .opt{
    display:block; width:100%; text-align:left; background:#232738; border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:1rem;
  }
  .opt:hover{border-color:var(--accent2);}
  .opt.correct{background:rgba(6,214,160,.25); border-color:var(--accent2);}
  .opt.wrong{background:rgba(239,71,111,.25); border-color:var(--danger);}
  .opt[disabled]{cursor:default;}
  .explain{margin-top:12px; padding:12px; background:#151824; border-radius:10px; color:var(--muted); font-size:.9rem;}
  .nextbtn{margin-top:16px; width:100%; padding:14px; border:none; border-radius:10px; background:var(--accent2); color:#04101a; font-weight:700; font-size:1rem; cursor:pointer;}
  .score-big{font-size:2.6rem; text-align:center; margin:10px 0; font-weight:800; color:var(--accent);}
  .name-input{width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#232738; color:var(--text); font-size:1rem; margin-bottom:12px;}
  .lb-row{display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--border); font-size:.95rem;}
  .backlink{display:inline-block; margin-top:14px; color:var(--muted); text-decoration:none; font-size:.85rem;}
  .backlink:hover{color:var(--text);}
  .badge{display:inline-block; background:#232738; color:var(--muted); padding:2px 10px; border-radius:20px; font-size:.75rem; margin-bottom:10px;}
  .day-select{width:100%; padding:14px; border-radius:10px; border:1px solid var(--border); background:#232738; color:var(--text); font-size:1rem; margin-bottom:12px;}
  .footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:24px; padding-bottom:10px;}
  .footer b{color:var(--accent);}
  .phrase-popup{
    position:fixed; top:14%; left:50%; transform:translate(-50%,-20px) scale(0.85);
    padding:16px 28px; border-radius:16px; font-size:1.4rem; font-weight:800; color:#fff;
    opacity:0; z-index:999; text-align:center; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 8px 30px rgba(0,0,0,.4); white-space:nowrap;
  }
  .phrase-popup.show{opacity:1; transform:translate(-50%,0) scale(1);}
  .popup-correct{background:linear-gradient(135deg,#06d6a0,#04a5f4);}
  .popup-wrong{background:linear-gradient(135deg,#ef476f,#ff6b35);}
</style>

const app = document.getElementById('app');
let state = { mode:null, day:null, questions:[], idx:0, score:0, answered:false };

/* ============ AUDIO / SPEECH ENGINE (single reusable context) ============ */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}

let ttsVoices = [];
function loadVoices(){ try{ ttsVoices = speechSynthesis.getVoices() || []; }catch(e){} }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{ getAudioCtx(); }catch(e){}
  try{
    if('speechSynthesis' in window){
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0.01;
      speechSynthesis.speak(warm);
    }
  }catch(e){}
}
// Unlock on the very first tap anywhere in the app (required by mobile browsers)
document.addEventListener('click', unlockAudio, { once:true });
document.addEventListener('touchstart', unlockAudio, { once:true });
/* =========================================================================== */


function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 1;
    u.pitch = 1.1;
    u.volume = 1;
    if(!ttsVoices.length) loadVoices();
    const voice = ttsVoices.find(v => v.lang === (lang||'en-US')) || ttsVoices.find(v => v.lang && v.lang.startsWith('en'));
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

function showPhrasePopup(text, type){
  const popup = document.createElement('div');
  popup.className = 'phrase-popup ' + (type === 'correct' ? 'popup-correct' : 'popup-wrong');
  popup.textContent = text;
  document.body.appendChild(popup);
  requestAnimationFrame(()=> popup.classList.add('show'));
  setTimeout(()=>{
    popup.classList.remove('show');
    setTimeout(()=> popup.remove(), 300);
  }, 1500);
}

const PRAISE_PHRASES = [
  "Good job!", "Fantastic!", "Fabulous!", "Excellent!", "Marvelous!",
  "Brilliant!", "Outstanding!", "Spot on!", "Superb!", "Spectacular!",
  "You're on fire!", "Genius level!", "Absolutely perfect!"
];
const FAIL_PHRASES = [
  "Oh no, please try again!", "Try later.", "Better luck next time!",
  "So close! Try again!", "Don't give up yet!", "You'll get the next one!",
  "Nice try!", "Oops, not quite!"
];

let lastPraise = null, lastFail = null;
function pickPhrase(pool, lastPicked, setLast){
  let choice;
  if(pool.length <= 1) choice = pool[0];
  else { do { choice = pool[Math.floor(Math.random()*pool.length)]; } while(choice === lastPicked); }
  setLast(choice);
  return choice;
}

function playClap(ctx, delay){
  if(!ctx) return;
  try{
    const bufferSize = Math.floor(ctx.sampleRate * 0.18);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2.5);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1800; filter.Q.value = 0.8;
    const g = ctx.createGain(); g.gain.value = 0.9;
    noise.connect(filter); filter.connect(g); g.connect(ctx.destination);
    noise.start(ctx.currentTime + delay);
  }catch(e){}
}

function playCorrectSound(){
  const phrase = pickPhrase(PRAISE_PHRASES, lastPraise, (v)=>lastPraise=v);
  try{
    const ctx = getAudioCtx();
    if(ctx){
      const notes = [523.25, 659.25, 783.99, 1046.5]; // C-E-G-C victory chime
      notes.forEach((f,i)=>{
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        const start = ctx.currentTime + i*0.09;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.22, start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start+0.16);
        o.start(start); o.stop(start+0.17);
      });
      playClap(ctx, 0.42); playClap(ctx, 0.56); playClap(ctx, 0.70);
    }
  }catch(e){}
  speak(phrase, 'en-US');
  showPhrasePopup(phrase, 'correct');
}

function playWrongSound(){
  const phrase = pickPhrase(FAIL_PHRASES, lastFail, (v)=>lastFail=v);
  try{
    const ctx = getAudioCtx();
    if(ctx){
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(320, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(110, ctx.currentTime+0.45);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.16, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.45);
      o.start(); o.stop(ctx.currentTime+0.45);
    }
  }catch(e){}
  speak(phrase, 'en-US');
  showPhrasePopup(phrase, 'wrong');
}

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

// True Fisher-Yates shuffle for MCQ options — guarantees uniform random order every render
function fisherYatesShuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderHome(){
  const days = Object.keys(QUIZ_DATA);
  let opts = days.map(d=>`<option value="${d}">Day ${d} — ${QUIZ_DATA[d].title} (${QUIZ_DATA[d].questions.length} Qs)</option>`).join('');
  let html = `<div class="card">
    <button class="mode-btn mix" onclick="startMix()">🔀 Mix Mode — 30 Random Questions (All Days)</button>
    <div style="color:var(--muted);font-size:.85rem;margin:14px 0 4px;">या एक Day चुनें:</div>
    <select class="day-select" id="daySelect">${opts}</select>
    <button class="mode-btn" style="background:var(--accent2);color:#04101a;" onclick="startDay(document.getElementById('daySelect').value)">▶️ Quiz शुरू करें</button>
  </div>
  <div class="card" style="text-align:center;">
    <button class="mode-btn" style="background:#232738;color:var(--text);" onclick="renderLeaderboard()">🏆 Leaderboard देखें</button>
  </div>`;
  app.innerHTML = html;
}

function startDay(d){
  state = { mode:'day', day:d, questions: shuffle(QUIZ_DATA[d].questions), idx:0, score:0, answered:false };
  renderQuestion();
}
function startMix(){
  let all = [];
  Object.keys(QUIZ_DATA).forEach(d=> QUIZ_DATA[d].questions.forEach(q=> all.push(q)));
  all = shuffle(all).slice(0, 30);
  state = { mode:'mix', day:null, questions: all, idx:0, score:0, answered:false };
  renderQuestion();
}

function renderQuestion(){
  const q = state.questions[state.idx];
  // Fisher-Yates shuffle option order on every render — correct answer position is never predictable
  const displayIndices = fisherYatesShuffle(q.opts.map((_,i)=>i));
  state.currentDisplayIndices = displayIndices; // displayIndices[displayPos] = originalOptIndex
  state.currentCorrectDisplayPos = displayIndices.indexOf(q.correct);
  const pct = Math.round((state.idx/state.questions.length)*100);
  let optsHtml = '';
  displayIndices.forEach((origIdx, displayPos)=>{
    optsHtml += `<button class="opt" onclick="selectOpt(${displayPos})" id="opt${displayPos}">${q.opts[origIdx]}</button>`;
  });
  app.innerHTML = `
    <div class="badge">${state.mode==='mix' ? 'Mix Mode' : 'Day '+state.day+' — '+QUIZ_DATA[state.day].title}</div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qcount">Question ${state.idx+1} / ${state.questions.length}</div>
      <div class="qtext-en">${q.en}</div>
      <div class="qtext-hi">${q.hi}</div>
      <div id="optsWrap">${optsHtml}</div>
      <div id="explainWrap"></div>
    </div>`;
}

function selectOpt(displayPos){
  if(state.answered) return;
  unlockAudio();
  state.answered = true;
  const q = state.questions[state.idx];
  const correctDisplayPos = state.currentCorrectDisplayPos;
  const correct = displayPos === correctDisplayPos;
  if(correct) state.score++;
  if(correct) playCorrectSound(); else playWrongSound();
  const optButtons = document.querySelectorAll('#optsWrap .opt');
  optButtons.forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx === correctDisplayPos){
      btn.classList.add('correct');
      btn.innerHTML = '✅&nbsp; ' + btn.innerHTML;
    } else if(idx === displayPos){
      btn.classList.add('wrong');
      btn.innerHTML = '❌&nbsp; ' + btn.innerHTML;
    }
  });
  document.getElementById('explainWrap').innerHTML = `
    <div class="explain">${correct ? '✅ सही जवाब!' : '❌ गलत।'} ${q.exp}</div>
    <button class="nextbtn" onclick="nextQuestion()">${state.idx+1 < state.questions.length ? 'अगला सवाल →' : 'परिणाम देखें →'}</button>`;
}

function nextQuestion(){
  state.idx++;
  state.answered = false;
  if(state.idx >= state.questions.length){ renderResult(); return; }
  renderQuestion();
}

function renderResult(){
  const total = state.questions.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card" style="text-align:center;">
      <div style="font-size:1.1rem;color:var(--muted);">आपका स्कोर</div>
      <div class="score-big">${state.score} / ${total}</div>
      <div style="color:var(--accent2);margin-bottom:16px;">${pct}%</div>
      <input class="name-input" id="playerName" placeholder="अपना नाम लिखें (Leaderboard के लिए)">
      <button class="mode-btn" onclick="saveScore()">Score सेव करें</button>
      <button class="mode-btn mix" onclick="renderHome()">🏠 वापस Home पर जाएँ</button>
    </div>`;
}

function saveScore(){
  const name = document.getElementById('playerName').value.trim() || 'Student';
  const entry = { name, score: state.score, total: state.questions.length, mode: state.mode==='mix'?'Mix':'Day '+state.day, date: new Date().toLocaleDateString('en-IN') };
  let lb = JSON.parse(localStorage.getItem('fea_trb_leaderboard') || '[]');
  lb.push(entry);
  lb.sort((a,b)=> (b.score/b.total) - (a.score/a.total));
  localStorage.setItem('fea_trb_leaderboard', JSON.stringify(lb.slice(0,50)));
  renderLeaderboard();
}

function renderLeaderboard(){
  let lb = JSON.parse(localStorage.getItem('fea_trb_leaderboard') || '[]');
  let rows = lb.length ? lb.slice(0,20).map((e,i)=>`
    <div class="lb-row"><span>${i+1}. ${e.name} <small style="color:var(--muted)">(${e.mode})</small></span><span>${e.score}/${e.total}</span></div>
  `).join('') : `<div style="color:var(--muted);text-align:center;padding:10px;">अभी कोई स्कोर नहीं है।</div>`;
  app.innerHTML = `<div class="card"><h2 style="margin-top:0;">🏆 Leaderboard</h2>${rows}
    <a class="backlink" onclick="renderHome()" href="javascript:void(0)">← वापस Home पर जाएँ</a></div>`;
}

renderHome();
</script>
